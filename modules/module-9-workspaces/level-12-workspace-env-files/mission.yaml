name: Mast Profiles
description: >-
  Pinewood Mobile, a mobile phone mast operator, keeps one YAML settings file per environment in env/, chosen by workspace name.
  In the dev workspace the build dies complaining about an attribute on a string, and in prod
  there is no settings file for the workspace at all.
objective: >-
  In workspaces dev, staging and prod the config must load env/<workspace>.yaml and write
  out/<workspace>-mast.conf. The outputs carrier and power_watts must be 796.5/50 for dev,
  1842.5/200 for staging and 2652.5/1000 for prod.
xp: 195
difficulty: intermediate
expected_time: 12m
concepts:
  - file function
  - yamldecode
  - per-environment config
  - terraform.workspace
module: module-9-workspaces
level: level-12-workspace-env-files
