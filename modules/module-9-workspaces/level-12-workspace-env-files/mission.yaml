name: Wheel Profiles
description: >-
  Pinewood Ferris Wheel Hire keeps one YAML settings file per environment in env/, chosen by workspace name.
  In the dev workspace the build dies complaining about an attribute on a string, and in prod
  there is no settings file for the workspace at all.
objective: >-
  In workspaces dev, staging and prod the config must load env/<workspace>.yaml and write
  out/<workspace>-wheel.conf. The outputs rotation and pod_count must be 412.5/12 for dev,
  540.5/24 for staging and 725.5/36 for prod.
xp: 195
difficulty: intermediate
expected_time: 12m
concepts:
  - file function
  - yamldecode
  - per-environment config
  - terraform.workspace
module: module-9-workspaces
level: level-12-workspace-env-files
