name: Relay Perches
description: >-
  A pigeon-post network keeps one perch card per relay station. The pilot workspace runs two
  stations and the network workspace runs every station, each with its own list in a locals map.
  The plan refuses to expand the list into resources.
objective: >-
  In the pilot workspace there must be exactly two local_file.perch instances and in the network
  workspace exactly four, keyed by station slug (elm-hill, dovecote, mill-pond, ash-cross). The
  output station_count must match.
xp: 210
difficulty: intermediate
expected_time: 12m
concepts:
  - for_each
  - toset
  - terraform.workspace
module: module-9-workspaces
level: level-8-workspace-for-each
