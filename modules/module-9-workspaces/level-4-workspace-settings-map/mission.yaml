name: Hut Count Missing
description: >-
  The seafront beach hut rental lays out its huts from a settings map keyed by workspace. Dev
  and prod have entries, but the new qa workspace, created for the staff dry run, stops every
  plan with an indexing error.
objective: >-
  Make the config work in the qa workspace with 12 huts, hours 09-16 and no towels, while dev (4
  huts, 10-14, no towels) and prod (24 huts, 08-18, towels) keep their values. The settings must
  still be looked up by terraform.workspace.
xp: 190
difficulty: intermediate
expected_time: 10m
concepts:
  - locals map
  - terraform.workspace
  - lookup
module: module-9-workspaces
level: level-4-workspace-settings-map
