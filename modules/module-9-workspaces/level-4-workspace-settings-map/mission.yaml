name: Stall Count Missing
description: >-
  The Riverbank farmers' market lays out its stalls from a settings map keyed by workspace. Dev
  and prod have entries, but the new qa workspace, created for the volunteer dry run, stops every
  plan with an indexing error.
objective: >-
  Make the config work in the qa workspace with 12 stalls, hours 09-16 and no music, while dev (4
  stalls, 10-14, no music) and prod (24 stalls, 08-18, music) keep their values. The settings must
  still be looked up by terraform.workspace.
xp: 190
difficulty: intermediate
expected_time: 10m
concepts:
  - locals map
  - terraform.workspace
  - lookup
module: module-9-workspaces
level: level-4-workspace-settings-map
