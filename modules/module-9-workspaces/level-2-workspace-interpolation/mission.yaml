name: Lavender Crate Labels
description: >-
  Brackenfield Lavender Farm keeps one workspace per harvest, such as midsummer or late-bloom. The crate
  manifest is meant to be named after the harvest, but the files and labels come out stamped with
  the literal text of the expression instead of the workspace name.
objective: >-
  In a workspace named midsummer, Terraform must write out/midsummer-crates.txt whose first line is
  'Harvest: midsummer', and the output crate_label must be 'midsummer-3'. The same config must work for
  any workspace name.
xp: 180
difficulty: intermediate
expected_time: 10m
concepts:
  - terraform.workspace
  - string interpolation
  - locals
module: module-9-workspaces
level: level-2-workspace-interpolation
