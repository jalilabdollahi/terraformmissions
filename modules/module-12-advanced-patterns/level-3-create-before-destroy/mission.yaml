name: Marquee Never Goes Dark
description: >-
  The Moonlight Drive-In writes its marquee board with create_before_destroy so the sign is never
  blank. Tonight's feature changed and the apply 'succeeds', yet the sign file is gone afterwards and
  the next plan wants to create it again.
objective: >-
  Keep create_before_destroy, replace the board with tonight's feature (NOW SHOWING: Return of the
  Giant Ant), and end up with a board file on disk, no leftover file for last week's film, and a clean
  plan.
xp: 275
difficulty: advanced
expected_time: 15m
concepts:
  - create_before_destroy
  - replacement order
  - unique names
module: module-12-advanced-patterns
level: level-3-create-before-destroy
