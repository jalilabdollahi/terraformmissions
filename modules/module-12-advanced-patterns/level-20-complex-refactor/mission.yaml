name: Bounce Hollow Big Bang
description: >-
  Bounce Hollow trampoline park merged a large refactor into one commit: court wristbands and cards moved
  from count to for_each, the kangaroo mascot left the configuration, and the scoreboard high score must now
  be managed. Terraform sees none of that intent and plans to destroy and recreate almost everything.
objective: >-
  Describe all three changes in code (moved blocks, a removed block with destroy = false, an import
  block) so that the plan has no destroys or replacements: the three court wristbands and cards keep
  their IDs under name keys, the mascot leaves state while its costume stays valid, high score 7421 is
  adopted, and the plan ends clean.
xp: 400
difficulty: advanced
expected_time: 30m
concepts:
  - moved blocks
  - removed blocks
  - import blocks
  - zero-downtime refactoring
module: module-12-advanced-patterns
level: level-20-complex-refactor
