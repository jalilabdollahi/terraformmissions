name: Axe Bar Tfvars Writer
description: >-
  The Blue Note axe-throwing bar generates the settings file for its booking stack from a Terraform object,
  and reads last month's file back to compute how many seats were added. The config uses Terraform's
  built-in provider functions, but Terraform says they do not exist.
objective: >-
  Make the encode_tfvars and decode_tfvars calls work as they are written: stack/night.tfvars must be
  the encode_tfvars rendering of the venue object and the output seat_growth must be 8.
xp: 275
difficulty: advanced
expected_time: 12m
concepts:
  - provider-defined functions
  - encode_tfvars
  - decode_tfvars
  - required_providers
module: module-12-advanced-patterns
level: level-15-provider-functions
