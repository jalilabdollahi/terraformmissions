name: Reflash On Release
description: >-
  Cabinet PB-114 at the Bumper & Flip arcade just got firmware 3.2. The operations team wanted the
  cabinet record rebuilt on every firmware release, yet the plan only shows a small in-place update
  for the firmware pack and leaves the cabinet alone.
objective: >-
  Make a firmware change replace terraform_data.cabinet (new ID) while terraform_data.calibration and
  terraform_data.firmware_pack keep their IDs. Apply, and finish with a clean plan and an up-to-date
  service/pb-114.txt.
xp: 275
difficulty: advanced
expected_time: 15m
concepts:
  - replace_triggered_by
  - lifecycle
  - terraform_data
module: module-12-advanced-patterns
level: level-4-replace-triggered-by
