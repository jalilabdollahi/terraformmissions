name: Four Shaping Tickets
description: >-
  Saltwater Shapers surfboard workshop is retiring its old ticket software. Four paper job tickets are already
  pinned to blanks on the racks, but only the longboard job was written as an import. The plan shows the other three
  being created with brand-new numbers.
objective: >-
  Adopt all four tickets (longboard 4021, shortboard 7316, fish 2288, gun 5907) with a single import block
  that loops over var.legacy_tickets. Nothing is created, the shaper keeps their codename, and
  shop/queue.txt lists the original numbers in alphabetical order.
xp: 275
difficulty: advanced
expected_time: 15m
concepts:
  - import for_each
  - bulk adoption
  - each.key and each.value
module: module-12-advanced-patterns
level: level-10-import-for-each
