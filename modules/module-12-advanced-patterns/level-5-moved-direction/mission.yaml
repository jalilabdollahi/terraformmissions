name: Master Key Moves Backwards
description: >-
  Hollis & Daughter Locksmiths renamed the safe's master key resource from master to master_key and added a moved
  block to keep it. Now terraform plan refuses to run at all and complains about a 'moved object' that
  'still exists'.
objective: >-
  Repair the moved block so it records the rename in the right direction. The key must keep its
  fingerprint under tls_private_key.master_key, the register file must not be rewritten, and the plan
  must be clean.
xp: 250
difficulty: advanced
expected_time: 15m
concepts:
  - moved blocks
  - from and to
  - refactoring
module: module-12-advanced-patterns
level: level-5-moved-direction
