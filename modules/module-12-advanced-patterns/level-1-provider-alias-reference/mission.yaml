name: Fossil Pit Wiring
description: >-
  The Hollin Quarry dig site stamps every specimen tag through a provider configuration named after
  its pit. After a rushed edit, terraform validate complains about a provider configuration that was
  never declared, and one reference is written in the old quoted style.
objective: >-
  Make random_id.north_tag use the north_pit configuration and random_id.south_tag use the south_pit
  configuration, both as bare references (no quotes). The configuration must apply, state must record
  each tag under its own alias, and dig/specimens.txt must list both tags.
xp: 250
difficulty: advanced
expected_time: 15m
concepts:
  - provider aliases
  - provider meta-argument
  - quoted references
module: module-12-advanced-patterns
level: level-1-provider-alias-reference
