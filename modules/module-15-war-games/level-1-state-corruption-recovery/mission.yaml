description: The terraform.tfstate file in the broken/ directory contains invalid
  JSON — it was corrupted by a failed write during a previous apply. Terraform cannot
  read it and refuses to operate. Recover by removing the corrupt state file, then
  apply cleanly to recreate the resources.
