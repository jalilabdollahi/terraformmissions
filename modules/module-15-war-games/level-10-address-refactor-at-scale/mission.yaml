description: 5 resources were renamed as part of a large refactor. The new config
  has the correct resource names, but the `moved` blocks mapping old names to new
  names are missing. Without them, Terraform will plan to destroy all 5 old resources
  and create 5 new ones. Add all 5 moved blocks to make the refactor zero-destructive.
