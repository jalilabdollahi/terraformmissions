name: Fenwick Stale State
description: >-
  INCIDENT 7184 - Fenwick Wildlife Rescue. The volunteer rota runs from a state file on the shared
  ops VM, and another team, restoring "last night's backup" for their own project, pushed a stale
  copy over it. Terraform now wants to create keeper Cleo's badge, the owl enclosure slot and a
  fresh quarantine bay for the injured heron, all of which already exist on paper and in the field.
  The recovery folder holds every copy anyone could find, and CI run 217's apply log, whose state
  upload failed.
objective: >-
  Recover the correct state: use the freshest valid copy of this project's own state (same
  lineage, not just the highest serial), adopt the quarantine bay assigned by CI run 217 under its
  original number, and finish with a clean plan. Every badge, enclosure slot, the rota epoch and
  the rota file must keep its original ID, and nothing may be destroyed or re-issued.
xp: 550
difficulty: expert
expected_time: 55m
concepts:
  - state lineage and serial
  - state push
  - import from logs
  - choosing the right backup
module: module-15-war-games
level: level-17-team-state-overwrite
