name: Halcyon Float Stack Breakup
description: >-
  INCIDENT 4108 - Halcyon Mardi Gras Float Warehouse. The one-state float warehouse stack has become so big that
  every krewe sign-up tweak locks the lighting team out of their deploys, and last night two plans
  collided. Change board CAB-4471 approved splitting it into warehouse, krewes and lighting
  stacks. The three new configs are scaffolded; the live objects are still all in monolith/. The
  rider capacity and bead series are already stamped on the float permits, so nothing may be re-issued.
objective: >-
  Move every object out of the monolith state into the right new stack (warehouse/, krewes/,
  lighting/) without destroying or re-creating any of them: the former random_id.rig_key lives
  on as random_id.light_key. Lighting needs the gold bead series exported by krewes. Leave
  monolith/ empty of objects and resource code, and finish with clean plans in all three stacks.
xp: 505
difficulty: expert
expected_time: 55m
concepts:
  - state mv between state files
  - terraform_remote_state
  - stack ordering
  - renames during a split
module: module-15-war-games
level: level-14-state-split
