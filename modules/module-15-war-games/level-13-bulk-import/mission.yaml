name: Alderwater Gauge Census
description: >-
  INCIDENT 3342 - Alderwater flood-warning network. Autumn storms are due in 36 hours and the
  duty officer wants every river gauge under Terraform before rotas are generated from it. The
  gauges already exist: their serial numbers are in the asset-database export
  register/gauges.json, along with two retired stations that must stay out. The first attempt
  at adoption plans to mint 17 brand-new serials, which would invalidate every housing label
  in the field.
objective: >-
  Adopt the 15 active gauges into random_id.gauge[station] with import blocks driven by
  for_each over the register, so each one keeps the serial printed on its housing. Retired
  stations must not be managed, no serial may be typed into the code, the network key keeps
  its ID, and the plan must end clean with out/gauge-roster.txt listing every active gauge.
xp: 490
difficulty: expert
expected_time: 50m
concepts:
  - import blocks with for_each
  - bulk adoption
  - ForceNew arguments
  - register-driven config
module: module-15-war-games
level: level-13-bulk-import
