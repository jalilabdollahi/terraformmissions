name: Marathon Cutoff Logic
description: >-
  The Saltmere marathon pacing sheet is generated by Terraform and its checks are written in a test
  file. Three assertions fail on a configuration that is behaving correctly: the error messages
  describe the right intent, but the conditions say the opposite.
objective: >-
  Fix the condition expressions in tests/pacing.tftest.hcl so every run passes, keeping all four
  asserts and their error messages. The code in pacing.tf is correct and must not change.
xp: 235
difficulty: advanced
expected_time: 10m
concepts:
  - assert condition
  - boolean logic
  - sort and reverse
module: module-10-testing
level: level-3-assert-condition
