name: Food Truck Rally Cards
description: >-
  Every truck at the Quayside food rally gets a pitch card generated from a map of trucks. The tests try to
  inspect individual cards but address them as if the cards were a numbered list, and Terraform rejects
  every one of them.
objective: >-
  Fix the instance addresses in tests/rally.tftest.hcl so that tacotl_card, pierogi_card and all_cards_issued
  pass, addressing the for_each instances by key. The three-truck check and the pitch text must stay.
xp: 305
difficulty: advanced
expected_time: 10m
concepts:
  - for_each instances
  - instance keys in tests
  - resource addressing
module: module-10-testing
level: level-17-for-each-test-index
