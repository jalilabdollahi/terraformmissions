name: Motorhome Pitch Cards
description: >-
  Every vehicle at the Quayside motorhome campsite gets a pitch card generated from a map of vehicles. The tests try to
  inspect individual cards but address them as if the cards were a numbered list, and Terraform rejects
  every one of them.
objective: >-
  Fix the instance addresses in tests/campsite.tftest.hcl so that nomad_card, voyager_card and all_cards_issued
  pass, addressing the for_each instances by key. The three-vehicle check and the pitch text must stay.
xp: 305
difficulty: advanced
expected_time: 10m
concepts:
  - for_each instances
  - instance keys in tests
  - resource addressing
module: module-10-testing
level: level-17-for-each-test-index
