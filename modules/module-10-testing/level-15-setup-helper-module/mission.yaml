name: Projection Booth Setup
description: >-
  A cinema computes whether a programme needs an intermission from a reel manifest file. The tests use
  a helper module to write that manifest before the real tests read it, but neither helper step does its
  job.
objective: >-
  Make setup, short_programme, setup_long and double_bill pass: both helper runs must really apply
  tests/setup and feed their manifest_path output to the run that follows. No manifest may be left behind
  after terraform test.
xp: 295
difficulty: advanced
expected_time: 15m
concepts:
  - setup module pattern
  - run module block
  - helper runs
module: module-10-testing
level: level-15-setup-helper-module
