name: Bike Courier Dispatch Mock
description: >-
  A bicycle courier co-op stamps every job with a random ticket and a random dispatch zone. To test the
  stamp format deterministically the team wrapped the random provider in a mock, but the mock either
  fails to load or hands out random values anyway.
objective: >-
  Repair the mock_provider "random" block in tests/dispatch.tftest.hcl so that mocked values reach the
  outputs: ticket BK-AB12CD34 and zone-4. All three runs must pass without removing the mock.
xp: 265
difficulty: advanced
expected_time: 12m
concepts:
  - mock_provider
  - mock_resource
  - defaults
module: module-10-testing
level: level-9-mock-provider
