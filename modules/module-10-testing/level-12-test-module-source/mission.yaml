name: Quilt Kit Modules
description: >-
  The Thimble and Thread quilting guild keeps two small helper modules, one for blocks and one for the
  border, and a kit order that combines them. Two test runs are meant to exercise the helpers directly
  but cannot find them.
objective: >-
  Make block_fabric, border_fabric and kit_total pass: each module run must point at the helper module's
  real directory, and the tests must keep checking 3468 cm2 for blocks and 7400 cm2 for the border.
xp: 280
difficulty: advanced
expected_time: 12m
concepts:
  - run module block
  - module source paths
  - terraform init for tests
module: module-10-testing
level: level-12-test-module-source
