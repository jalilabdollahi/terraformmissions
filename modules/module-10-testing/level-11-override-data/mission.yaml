name: Kite Festival Wind Check
description: >-
  Terraform decides whether the kite festival may fly by reading the anemometer's output file. That file
  only exists on the festival field, so the tests have to fake the reading with override_data, and
  two of the three scenarios cannot read it.
objective: >-
  Make calm_morning, gale_warning and gusty_edge pass using override_data on
  data.local_file.anemometer in each run (values must set the real attribute that the code reads).
  Do not create sensor/wind-knots.txt.
xp: 275
difficulty: advanced
expected_time: 12m
concepts:
  - override_data
  - data sources in tests
  - values attributes
module: module-10-testing
level: level-11-override-data
