name: Busker Pitch Board
description: >-
  The Cobbleway buskers' circuit posts a board for every busker: a JSON record and a list of its fields. The
  busker module already publishes performer, slot and setlist as outputs. The root configuration tries to
  use the whole module object as a single value and Terraform rejects both attempts.
objective: >-
  Use the entire module.busker object as the value: the board file board/busker.json must contain it
  as JSON, and the fields output must list the module's output names alphabetically
  (performer, setlist, slot). Don't type the field names or values out by hand: they must follow the module.
xp: 250
difficulty: intermediate
expected_time: 12m
concepts:
  - module object
  - jsonencode
  - keys function
module: module-6-modules
level: level-18-whole-module-output
