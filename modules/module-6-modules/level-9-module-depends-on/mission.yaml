name: Zamboni Waits For Ice
description: >-
  At the Northgate ice rink, a chiller module lays down the ice and writes an ice log, and a
  resurfacer module reads that log to schedule the next resurfacing. On a fresh checkout the plan dies
  because the log does not exist yet, and after a thickness change the schedule lags one apply behind.
objective: >-
  Make module.resurfacer wait for module.chiller with an explicit dependency. After one
  apply from scratch resurface_after_min must be 50 (twice the ice thickness of 25 mm), and after
  a single apply with -var thickness_mm=30 it must be 60.
xp: 235
difficulty: intermediate
expected_time: 12m
concepts:
  - depends_on on modules
  - hidden dependencies
  - data sources reading files
module: module-6-modules
level: level-9-module-depends-on
