name: Escape Room Door Code
description: >-
  The Cipher Cellar escape room draws a fresh door code for every booking in a module called room. The
  code is generated as a secret, and Terraform now refuses to plan because the root output passes it along
  without admitting that it is sensitive, and the module itself never documents that its output is a secret.
objective: >-
  Make the secret door code flow from module.room to the root output door_code with sensitivity
  declared on both outputs (the module's code and the root's door_code), still generated by random_password. terraform output must show door_code as sensitive;
  terraform output -raw door_code must print an all-digit code of the length given by code_length (6 by default),
  and the same code must end up in keys/booking.txt.
xp: 240
difficulty: intermediate
expected_time: 12m
concepts:
  - sensitive outputs
  - module outputs
  - random_password
module: module-6-modules
level: level-12-sensitive-module-output
