name: Register Approval Plan
description: >-
  Ludlow Land Registry Office's change process says the clerk who applies the register must apply exactly
  the plan the registrar signed off, not whatever a fresh plan looks like at apply time. The
  registrar approved plan.tfplan this morning, but before the clerk could use it another clerk
  applied one of the new transfers by hand. Now "terraform apply plan.tfplan" refuses to run.
objective: >-
  Get all five transfers (register/t-3011 ... t-3015) onto disk by applying a freshly saved plan file:
  plan.tfplan must be a new, valid saved plan that still contained the creations you applied,
  it must differ from the stale one the level started with, and the plan must be clean afterwards.
xp: 349
difficulty: expert
expected_time: 15m
concepts:
  - plan -out
  - apply with a plan file
  - stale plans
module: module-14-performance
level: level-8-saved-plan-apply
