description: A config uses `terraform.workspace` for resource naming but the convention
  is wrong. It concatenates components in the wrong order and uses an underscore separator
  instead of a dash. The required convention is `{workspace}-token-{N}` (dash-separated,
  workspace first). Fix the workspace-based naming throughout the config.
