name: Container Yard Split
description: >-
  The Marrow Quay container terminal has one Terraform state for everything: the yard identity
  (a random name and the gate count, both painted on trucks and printed on customs forms) and the
  crane roster that the shift planners change daily. Every roster tweak makes the platform team wait
  on a plan that also refreshes the yard identity. Time to partition: the identity moves to its own
  configuration under core/, and the roster configuration reads it from there.
objective: >-
  Create core/ as its own root module that owns random_pet.yard_name and random_integer.gate_count
  (with outputs yard_name and gate_count), move those two objects into core/terraform.tfstate without
  changing their values, and make the root configuration read them through a terraform_remote_state
  data source. Both root and core must plan clean.
xp: 328
difficulty: expert
expected_time: 25m
concepts:
  - state partitioning
  - terraform_remote_state
  - state mv -state-out
module: module-14-performance
level: level-5-state-partition
