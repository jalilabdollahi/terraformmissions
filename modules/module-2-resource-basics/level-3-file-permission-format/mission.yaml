name: Vending Fleet Tokens
description: >-
  The Hollowmere vending fleet's sync agent will not start unless its token file is private to
  the owner, and the depot scanner needs the manifest readable by everybody. The permission
  arguments in the config are written the way chmod would never accept them.
objective: >-
  Create fleet/sync.token with mode 0600 and fleet/machines.csv with mode 0644, and give the
  fleet/ directory mode 0755. Keep both resources and keep using the file_permission
  arguments.
xp: 120
difficulty: beginner
expected_time: 6m
concepts:
  - file_permission
  - local_sensitive_file
  - octal modes
module: module-2-resource-basics
level: level-3-file-permission-format
