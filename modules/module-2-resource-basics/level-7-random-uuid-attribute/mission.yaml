name: Parcel Locker Codes
description: >-
  Quillfeather Post issues each parcel-locker drop a UUID as its pickup code. The ticket
  writer and the pickup_code output both stopped working after a refactor, and the error talks
  about an attribute that apparently does not exist.
objective: >-
  Make lockers/ticket.json contain the drop_id and receipt UUIDs generated by the two
  random_uuid resources, and have the pickup_code output return the drop_id UUID.
xp: 125
difficulty: beginner
expected_time: 6m
concepts:
  - random_uuid
  - resource attributes
  - terraform validate
module: module-2-resource-basics
level: level-7-random-uuid-attribute
