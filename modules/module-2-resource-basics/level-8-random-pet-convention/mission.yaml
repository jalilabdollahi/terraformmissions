name: Donkey Nicknames
description: >-
  Cragmoor Donkey Sanctuary names its donkeys with random pet names so sponsors can book visits with them on
  a shared calendar. The jack's nickname is accepted by the sponsor card, but the
  jenny's nickname is rejected every time.
objective: >-
  Make both nicknames match ^donkey-[a-z]+-[a-z]+$ (the prefix, then exactly two words,
  separated by hyphens). Keep both resources and have the sponsor card list them.
xp: 130
difficulty: beginner
expected_time: 6m
concepts:
  - random_pet
  - prefix
  - separator
  - length
module: module-2-resource-basics
level: level-8-random-pet-convention
