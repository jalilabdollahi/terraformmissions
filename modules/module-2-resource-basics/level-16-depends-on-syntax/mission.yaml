name: Cookbook Bindery Order
description: >-
  At the Linden Lane bindery a shell command counts the cookbook's chapters, so it must run
  only after chapters.txt exists. The author tried to declare that with depends_on, but
  Terraform complains about both depends_on lists.
objective: >-
  Fix both depends_on arguments so they are valid resource references to local_file.chapters,
  keep the page counter's depends_on, and produce book/chapter-count.txt containing 5.
xp: 145
difficulty: beginner
expected_time: 8m
concepts:
  - depends_on
  - references
  - ordering
module: module-2-resource-basics
level: level-16-depends-on-syntax
