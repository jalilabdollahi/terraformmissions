name: Lucky Strike Jackpot Draw
description: >-
  The Lucky Strike bingo hall's jackpot draw is drawn by Terraform to keep the caller honest, but the
  draw refuses to run at all. Management insists the cards still run from 1000 to 1499.
objective: >-
  Draw a winning card between 1000 and 1499 inclusive using random_integer.winning_card,
  keep the locals as they are, and have hall/winner.txt announce that card.
xp: 120
difficulty: beginner
expected_time: 5m
concepts:
  - random_integer
  - min and max
  - locals
module: module-2-resource-basics
level: level-5-random-integer-range
