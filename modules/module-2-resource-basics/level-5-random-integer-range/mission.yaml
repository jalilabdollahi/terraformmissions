name: Harvest Fair Raffle
description: >-
  The Ashby Harvest Fair raffle is drawn by Terraform to keep the chairman honest, but the
  draw refuses to run at all. The committee insists the tickets still run from 1000 to 1499.
objective: >-
  Draw a winning ticket between 1000 and 1499 inclusive using random_integer.winning_ticket,
  keep the locals as they are, and have hall/winner.txt announce that ticket.
xp: 120
difficulty: beginner
expected_time: 5m
concepts:
  - random_integer
  - min and max
  - locals
module: module-2-resource-basics
level: level-5-random-integer-range
