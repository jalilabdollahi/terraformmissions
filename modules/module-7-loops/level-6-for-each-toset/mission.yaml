name: Saffron Twice
description: >-
  The Old Quarter spice market prints a price tag per stall, and the stalls are listed in a
  variable as plain strings. After a refactor from count to for_each, Terraform complains that it
  cannot iterate over a list of strings - and one spice appears twice in the list.
objective: >-
  Make for_each work on var.spices so there is exactly one tag per distinct spice, addressed as
  local_file.stall_tag["saffron"] and so on (four tags from the default list). Keep var.spices a
  list(string).
xp: 175
difficulty: intermediate
expected_time: 7m
concepts:
  - for_each
  - toset()
  - sets vs lists
module: module-7-loops
level: level-6-for-each-toset
