name: Every Room Every Day
description: >-
  The Larkspur Choir Festival books each rehearsal room for each rehearsal day, using setproduct
  to get all the pairs. Terraform rejects the result as a for_each argument.
objective: >-
  Create one booking per room and day, addressed local_file.booking["<room>/<day>"] (six today:
  aria, cantata, motet by fri, sat), with the file bookings/<room>-<day>.txt. Adding a day or room
  later must only add new bookings.
xp: 235
difficulty: intermediate
expected_time: 12m
concepts:
  - setproduct
  - for expression
  - for_each map
  - nested loops
module: module-7-loops
level: level-15-setproduct-pairs
