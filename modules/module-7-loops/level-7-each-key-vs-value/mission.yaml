name: Two Deckhands One Card
description: >-
  The Saltmarsh tugboat company writes a duty card for every sailor from a map of name to role.
  The cards folder has only three files, one of them called deckhand.txt, and the captain's card
  says her name is 'captain'.
objective: >-
  Write cards/<name>.txt for every sailor in var.crew (four files) containing exactly 'Name:
  <name>' and 'Role: <role>' on two lines. Instances must stay keyed by sailor name.
xp: 180
difficulty: intermediate
expected_time: 8m
concepts:
  - for_each
  - each.key
  - each.value
  - maps
module: module-7-loops
level: level-7-each-key-vs-value
