name: One Permit Shown
description: >-
  The street-food rally issues a permit per truck with a counted resource. The council's portal
  reads the permit_paths output and keeps complaining that it receives a single string, with only
  the first truck's permit.
objective: >-
  Make permit_paths a list that contains the path of every permit, in truck order, for any number
  of trucks - including an empty list when no truck registered.
xp: 165
difficulty: intermediate
expected_time: 7m
concepts:
  - count
  - splat expression
  - outputs
module: module-7-loops
level: level-5-count-splat-output
