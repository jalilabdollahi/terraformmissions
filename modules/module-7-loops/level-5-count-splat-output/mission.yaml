name: One Closure Shown
description: >-
  The city film office issues a closure permit per production with a counted resource. The film office's portal
  reads the closure_paths output and keeps complaining that it receives a single string, with only
  the first production's permit.
objective: >-
  Make closure_paths a list that contains the path of every closure permit, in production order, for any number
  of shoots - including an empty list when no production applied.
xp: 165
difficulty: intermediate
expected_time: 7m
concepts:
  - count
  - splat expression
  - outputs
module: module-7-loops
level: level-5-count-splat-output
