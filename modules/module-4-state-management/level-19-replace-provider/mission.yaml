name: Legacy Orchard Tags
description: >-
  Greenfield Orchard's crate-tagging project was last applied years ago with Terraform 0.12.
  Its state still records the random provider under the pre-0.13 address registry.terraform.io/-/random.
  Modern Terraform refuses to read it, and a fresh start would reissue every crate tag.
objective: >-
  Rewrite the provider address in the existing state to registry.terraform.io/hashicorp/random
  using the state CLI, so the original crate tag and pallet count survive, terraform init and
  plan work again, and the plan is clean.
xp: 245
difficulty: intermediate
expected_time: 12m
concepts:
  - terraform state replace-provider
  - provider source addresses
  - legacy state upgrade
module: module-4-state-management
level: level-19-replace-provider
