name: Buoy State Relocation
description: >-
  The North Sea buoy network's state has lived in state/buoys.tfstate since day one. The new
  repository layout keeps secrets-adjacent files in vault/, so the backend block already points
  at vault/buoys-prod.tfstate, and terraform now refuses to run because the backend changed.
objective: >-
  Move the existing state to the new path declared in terraform.tf so it holds the original
  buoy serial and sampling interval, with no resources recreated, and finish with a clean plan.
  Keep the backend path in terraform.tf as it is.
xp: 230
difficulty: intermediate
expected_time: 12m
concepts:
  - terraform init -migrate-state
  - backend change
  - state relocation
module: module-4-state-management
level: level-14-backend-migrate
