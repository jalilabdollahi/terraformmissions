name: Velvet Door Codes
description: >-
  Club Velvet generates door codes with Terraform, one per entrance. A bartender
  texted the DJ booth code to a friend, so that single code must be regenerated tonight,
  while the main door, VIP and cloakroom codes stay valid on the printed staff cards.
objective: >-
  Regenerate only random_integer.door_code["dj"] using a Terraform CLI option, so its value
  changes while the other three codes stay exactly as they were. Do not change the code, and
  finish with a clean plan.
xp: 215
difficulty: intermediate
expected_time: 10m
concepts:
  - apply -replace
  - for_each addresses
  - forced replacement
module: module-4-state-management
level: level-17-replace-flag
