name: Provenance Fingerprints
description: >-
  Hammerstone's authentication desk wants proof that the lot-catalogue state file they were handed is the genuine
  one. They ask for three fingerprints: the state's serial number, its lineage ID, and the hex
  value of the lot seal. The raw state JSON has all of them.
objective: >-
  Pull the state with terraform state pull and use jq to write answers/serial.txt (the state
  serial), answers/lineage.txt (the lineage UUID) and answers/seal-hex.txt (the hex attribute
  of random_id.lot_seal). Change nothing in the infrastructure.
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - terraform state pull
  - jq
  - state serial and lineage
module: module-4-state-management
level: level-5-state-pull-jq
