name: Renamed Zip Passes
description: >-
  At Splashdown Treetop Adventure Park a refactor renamed two resources to match the new naming scheme:
  the climb-pass code and the harness sign. Terraform now plans to destroy both and issue new
  codes, but the codes are already on sold harness tags.
objective: >-
  Keep the new names random_id.climb_pass and local_file.harness_sign, and record the renames
  in the configuration with moved blocks so the existing objects (same IDs) are kept. Apply,
  and finish with a clean plan. Do not use the terraform state mv command.
xp: 190
difficulty: intermediate
expected_time: 10m
concepts:
  - moved block
  - refactoring safely
  - from and to addresses
module: module-4-state-management
level: level-10-moved-rename
