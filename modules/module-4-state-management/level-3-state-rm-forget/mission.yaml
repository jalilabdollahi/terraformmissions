name: Stud Book Handover
description: >-
  Meadowbrook Stud's stud book is moving to the regional breeders' association, who will
  maintain records/stud-book.txt themselves from now on. Our Terraform config still
  manages that file, so the next cleanup would delete the association's only copy.
objective: >-
  Stop managing local_file.stud_book without deleting the file: remove it from the state
  and from the configuration, keep records/stud-book.txt on disk untouched, keep
  local_file.vet_log managed, and finish with a clean plan. Use the state CLI, not a
  removed block.
xp: 190
difficulty: intermediate
expected_time: 10m
concepts:
  - terraform state rm
  - forgetting vs destroying
  - orphaned resources
module: module-4-state-management
level: level-3-state-rm-forget
