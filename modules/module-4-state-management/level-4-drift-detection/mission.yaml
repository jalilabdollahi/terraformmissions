name: Midnight Kiln Tweak
description: >-
  The night technician at a pottery studio hand-edited kiln/firing-schedule.txt on the
  controller to save a batch of glazes. Terraform did not make that change, and the plan now
  wants to "create" the schedule file again, which would overwrite the technician's values.
objective: >-
  Find out what the technician changed, update the configuration so the schedule describes
  the values currently on the kiln controller, and end with a clean plan. The file must keep
  the technician's values; do not revert them.
xp: 200
difficulty: intermediate
expected_time: 12m
concepts:
  - configuration drift
  - plan -refresh-only
  - reconciling code with reality
module: module-4-state-management
level: level-4-drift-detection
