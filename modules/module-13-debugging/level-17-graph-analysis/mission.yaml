name: Olive Oil Bottling Graph
description: >-
  The Sunridge Olive Oil Mill's bottling paperwork is generated from seven linked resources, and the dispatch
  step sometimes fails on a fresh checkout with "bottling/manifest.txt is missing" - and works when
  you just run the apply again. The mill manager also asks two questions about the setup: which resource
  has the most others hanging off it, and how long the longest chain of "must exist before" is.
objective: >-
  Use terraform graph to read the dependency edges. Write answers/graph.txt with two lines, hub=<address
  of the managed resource with the most direct dependents> and longest_chain=<number of managed resources
  on the longest dependency chain, after your fix>, and then fix the configuration so dispatch can
  only start after the manifest exists. A fresh apply must succeed every time.
xp: 325
difficulty: advanced
expected_time: 20m
concepts:
- terraform graph
- implicit dependencies
- depends_on
- race conditions
module: module-13-debugging
level: level-17-graph-analysis
