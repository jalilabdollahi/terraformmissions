name: Quayside Lane Bookings
description: >-
  The Quayside public swimming baths keeps its lane booking sheet in Terraform. After a late-night
  edit, terraform refuses to read the file and complains about block types it has never heard of.
objective: >-
  Fix the misspelled top-level block keywords so the configuration applies and lanes/booking.txt
  reads "Lane: Lane 4 (fast, 25 m)" and "Slot length: 3h" on two lines. Keep the lane variable
  and the booking_path output.
xp: 100
difficulty: beginner
expected_time: 5m
concepts:
  - block types
  - variable block
  - output block
module: module-1-foundations
level: level-2-block-keyword-typo
