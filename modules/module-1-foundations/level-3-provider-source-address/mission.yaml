name: Thistledown Apiary
description: >-
  A beekeeper's inspection log is generated by Terraform, but terraform init fails before any hive is
  counted. The error talks about a provider that cannot be found in the registry.
objective: >-
  Make terraform init succeed by correcting the provider's source address, then apply so
  apiary/inspection.txt lists both hives and the total_bees output is 84500.
xp: 105
difficulty: beginner
expected_time: 5m
concepts:
  - required_providers
  - provider source address
  - terraform init
module: module-1-foundations
level: level-3-provider-source-address
