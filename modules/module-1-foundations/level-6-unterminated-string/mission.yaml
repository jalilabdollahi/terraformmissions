name: Marlowe Museum Placards
description: >-
  The spring exhibition placards are generated by Terraform. One of the strings is missing a quote, and
  the error messages complain about newlines and strings in places that look perfectly fine.
objective: >-
  Fix the string so the config applies. placards/gallery-4.txt must hold two lines (the gallery title and
  "Curated by Ines Calloway") and placards/gallery-7.txt must be untouched.
xp: 110
difficulty: beginner
expected_time: 6m
concepts:
  - string literals
  - quoting
  - parser errors
module: module-1-foundations
level: level-6-unterminated-string
