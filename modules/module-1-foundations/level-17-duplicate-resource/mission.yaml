name: Inkwell Row Flash Sheets
description: >-
  The studio prints one flash sheet per design. A colleague copied the swallow flash sheet into a new file
  for the autumn flash event, and now Terraform refuses to load the module because something is declared twice.
objective: >-
  Keep both designs. After applying, flash/swallow.txt and flash/anchor.txt must both exist
  with their own text, and state must hold two local_file resources.
xp: 140
difficulty: beginner
expected_time: 6m
concepts:
  - resource addresses
  - duplicate declarations
  - multi-file modules
module: module-1-foundations
level: level-17-duplicate-resource
