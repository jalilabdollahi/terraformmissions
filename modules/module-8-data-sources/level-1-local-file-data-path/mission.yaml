name: Steelpan Tuning Sheet
description: >-
  The tuner at the Calypso Hill steelpan yard keeps each pan's tuning notes in a text
  file. Terraform is supposed to read the sheet and print a pan card, but the
  plan dies before a single note is counted.
objective: >-
  Make the data source read the real tuning sheet so that output pan_name is
  "Tenor Lead" and note_count is 29, and out/pan-card.txt is generated from it.
  The values must keep coming from the sheet, not from the config.
xp: 150
difficulty: intermediate
expected_time: 8m
concepts:
  - data.local_file
  - path.module
  - file paths
module: module-8-data-sources
level: level-1-local-file-data-path
