name: Organ Loft Tuning Sheet
description: >-
  The voicer at St Brannock's church keeps each organ stop's tuning notes in a text
  file. Terraform is supposed to read the sheet and print a wind-chest card, but the
  plan dies before a single pipe is counted.
objective: >-
  Make the data source read the real tuning sheet so that output stop_name is
  "Principal 8'" and pipe_count is 56, and out/chest-card.txt is generated from it.
  The values must keep coming from the sheet, not from the config.
xp: 150
difficulty: intermediate
expected_time: 8m
concepts:
  - data.local_file
  - path.module
  - file paths
module: module-8-data-sources
level: level-1-local-file-data-path
