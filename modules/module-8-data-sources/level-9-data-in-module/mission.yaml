name: Ranger Snow Patrol
description: >-
  Each ranger on the national park's trails leaves a JSON note. A small local module wraps the data
  source that reads one note and hands back a reading. The root config that calls the
  module twice cannot find the values it asks for.
objective: >-
  Make the root config use what the module really outputs. lowest_snow_cm must be 148 and
  open_trails must be ["north"]; the patrol log must show both rangers. The data source must
  stay inside the module.
xp: 175
difficulty: intermediate
expected_time: 10m
concepts:
  - data sources in modules
  - module outputs
  - object outputs
module: module-8-data-sources
level: level-9-data-in-module
