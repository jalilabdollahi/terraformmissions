name: Score Folio Contents
description: >-
  A sheet music publisher builds the contents page of a songbook from one score file per piece. The
  score data source uses count, one instance per piece, but the config does not handle
  its instances correctly and the plan refuses to run.
objective: >-
  Make the contents page list every piece in order. With the default list, total_notes is
  3580 and piece_titles has three titles; with scores=["p04","p02"] the outputs must
  follow the new list.
xp: 175
difficulty: intermediate
expected_time: 12m
concepts:
  - count on data sources
  - count.index
  - splat and for over instances
module: module-8-data-sources
level: level-7-data-count
