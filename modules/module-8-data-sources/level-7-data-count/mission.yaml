name: Galley Proof Contents
description: >-
  A print shop builds the contents page of a novel from one galley file per chapter. The
  galley data source uses count, one instance per chapter, but the config does not handle
  its instances correctly and the plan refuses to run.
objective: >-
  Make the contents page list every chapter in order. With the default list, total_words is
  3580 and chapter_titles has three titles; with galleys=["ch04","ch02"] the outputs must
  follow the new list.
xp: 175
difficulty: intermediate
expected_time: 12m
concepts:
  - count on data sources
  - count.index
  - splat and for over instances
module: module-8-data-sources
level: level-7-data-count
