name: "Pine Ridge Passphrase"
description: >-
  The Pine Ridge fire lookout's radio gets its admin passphrase from a local value that someone typed years ago, and every volunteer who ever staffed the tower knows it. The park service wants the passphrase generated by Terraform instead of living in the source.
objective: >-
  Delete the hard-coded passphrase and generate it with a random_password resource named radio_admin (24+ characters with at least two lower-case, two upper-case and two numeric characters). radio/admin.conf must contain it as admin_passphrase=... with mode 0600, and the plan must stay clean on the next run.
xp: 250
difficulty: advanced
expected_time: 12m
concepts:
  - random_password
  - hard-coded secrets
  - generated credentials
module: module-11-security
level: level-6-generated-not-hardcoded
