name: "Marrowby Chimney Sweep Key"
description: >-
  A chimney sweep round's nightly job-sheet sync logs in over SFTP with a key pair generated by Terraform. The private half is written next to the public half with ordinary file settings, and the sync tool now refuses to start, complaining that the private key is readable by others.
objective: >-
  Write the private key to keys/sweepround_ed25519 as a sensitive file with mode 0600 inside a keys/ directory of mode 0700, so ssh-keygen accepts it. The public key file and the public_key output must keep working.
xp: 250
difficulty: advanced
expected_time: 12m
concepts:
  - local_sensitive_file
  - file permissions
  - private keys
module: module-11-security
level: level-10-private-key-file-mode
