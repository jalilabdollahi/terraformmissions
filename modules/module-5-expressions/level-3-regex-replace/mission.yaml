name: Fenner Street Radio Tags
description: >-
  The repair bench at Fenner Street prints tags from messy intake notes. Nothing errors, but the printed serial still has punctuation, the fault note keeps its gaps, and the date is still the American-style ISO string.
objective: >-
  Make the tag show serial RX4411B09, the note "Dial cord snapped, crackle on long wave" and the date 17/03/2026 for the default inputs, by fixing the three replace() calls so they work for any input.
xp: 190
difficulty: intermediate
expected_time: 10m
concepts:
  - replace
  - regex patterns
  - capture groups
module: module-5-expressions
level: level-3-regex-replace
