name: Kittiwake Crew Roster
description: >-
  Submarine Kittiwake generates its crew roster by decoding config.yaml. Plan complains about a missing attribute, and once that is sorted out the roster shows manual 2.1 instead of 2.10 and a Norwegian interface language of false.
objective: >-
  Make the roster read Okonkwo manual 2.10 lang no, Reyes manual 1.8 lang en, Lindqvist manual 3.0 lang off, with the boat name Kittiwake and 2 crew members on watch. The Terraform code must still use yamldecode(file(...)) and work for other config files.
xp: 225
difficulty: intermediate
expected_time: 12m
concepts:
  - yamldecode
  - YAML type coercion
  - nested key paths
module: module-5-expressions
level: level-11-yamldecode-config
