name: Kaiten Corner Belts
description: >-
  Kaiten Corner sushi bar groups its plates by conveyor belt to print one belt board per belt. Plan fails with a duplicate key as soon as two plates share a belt.
objective: >-
  Build by_belt so each belt maps to the list of its plates in serving order (B1: TUNA-1, TUNA-2, TUNA-3; B2: EEL-1, EEL-2; B3: ROE-1) and create exactly one board file per belt.
xp: 205
difficulty: intermediate
expected_time: 9m
concepts:
  - for expression
  - grouping mode
  - duplicate keys
module: module-5-expressions
level: level-17-for-map-grouping
