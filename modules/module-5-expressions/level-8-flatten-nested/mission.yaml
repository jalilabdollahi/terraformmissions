name: Roxy Bout Stubs
description: >-
  The Roxy Boxing Club prints one ticket stub per bout, driven by a programme that lists the bouts for each ring. The nested loop that builds the bouts gives Terraform a list of lists, and for_each cannot make sense of it.
objective: >-
  Produce a flat list of bouts (ring + bout) and one local_file stub per bout, keyed "<ring>/<bout>": six stubs for the default programme, correct for any programme.
xp: 210
difficulty: intermediate
expected_time: 10m
concepts:
  - flatten
  - nested for
  - for_each over lists
module: module-5-expressions
level: level-8-flatten-nested
