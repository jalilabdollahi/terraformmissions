name: Hollin Feed Whiteboard
description: >-
  The grooms' feed whiteboard at Hollin Farm Riding Stables is generated from a ration table. When the manager added a fjord and a haflinger to the horse list, plan started failing because they have no tailored ration.
objective: >-
  Give listed breeds their own ration and every other horse the standard ration from var.standard_ration_kg (fjord 3 kg and haflinger 3 kg by default), with no hard-coded number.
xp: 165
difficulty: intermediate
expected_time: 7m
concepts:
  - lookup
  - map defaults
  - missing keys
module: module-5-expressions
level: level-6-lookup-default
