name: Marlow Hall Price Board
description: >-
  The box office at Marlow Hall builds its price board with formatlist(), one line per seating tier. Since someone pasted a hand-typed currency list into the call, terraform plan refuses to run at all.
objective: >-
  Make price_lines read Stalls — GBP 45.00, Circle — GBP 30.00, Gallery — GBP 18.50 for the defaults, using the single currency variable, and still work when there are more tiers.
xp: 165
difficulty: intermediate
expected_time: 8m
concepts:
  - formatlist
  - list lengths
  - broadcasting a single value
module: module-5-expressions
level: level-2-formatlist-lengths
