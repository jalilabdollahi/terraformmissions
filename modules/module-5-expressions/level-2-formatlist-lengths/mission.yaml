name: Ashdown Admission Board
description: >-
  The gate office at Ashdown Racecourse builds its price board with formatlist(), one line per enclosure tier. Since someone pasted a hand-typed currency list into the call, terraform plan refuses to run at all.
objective: >-
  Make price_lines read Members — GBP 45.00, Grandstand — GBP 30.00, Silver Ring — GBP 18.50 for the defaults, using the single currency variable, and still work when there are more tiers.
xp: 165
difficulty: intermediate
expected_time: 8m
concepts:
  - formatlist
  - list lengths
  - broadcasting a single value
module: module-5-expressions
level: level-2-formatlist-lengths
