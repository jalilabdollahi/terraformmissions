name: Menu Without Sizes
description: >-
  The Quill & Kettle café exports its drink menu to the till through a typed variable. Most drinks come in one size, so the paper menu leaves it blank, and Terraform rejects the tfvars file.
objective: >-
  Keep the menu data and make every drink that omits size end up with size regular, including new entries passed on the command line. Explicit sizes must be kept.
xp: 140
difficulty: beginner
expected_time: 7m
concepts:
  - optional-attributes
  - object-types
  - tfvars
module: module-3-variables-outputs
level: level-4-object-optional-attrs
