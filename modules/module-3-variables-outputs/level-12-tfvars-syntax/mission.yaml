name: Wiki Colon Syndrome
description: >-
  The Calder Bay whale-watching sailing notice takes its inputs from terraform.tfvars, which someone pasted from the old ops wiki. Terraform will not even read the file.
objective: >-
  Make plain terraform apply read terraform.tfvars and produce the notice for Calder Bay Whale Tours with 14 seats, sailings at 08:30 and 14:15, and compulsory lifejackets. Keep the values in terraform.tfvars (no defaults in the variable blocks).
xp: 175
difficulty: intermediate
expected_time: 7m
concepts:
  - tfvars
  - hcl-syntax
  - input-variables
module: module-3-variables-outputs
level: level-12-tfvars-syntax
