name: Ferry Off The End
description: >-
  The Harbourlight Ferry prints its first and last sailing of the day on a notice board generated by Terraform. After the winter schedule was loaded, the plan began failing on the board's last-sailing line.
objective: >-
  Make terraform apply work so output last_departure is 17:30 for the default timetable, and keep it correct when the departures list has a different number of sailings (the check also plans with 3 and 5 sailings).
xp: 130
difficulty: beginner
expected_time: 5m
concepts:
  - lists
  - indexing
  - length
module: module-3-variables-outputs
level: level-2-list-index-bounds
