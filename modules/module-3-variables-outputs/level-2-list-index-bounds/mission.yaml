name: Maze Off The End
description: >-
  The Sunnyfield Sunflower Maze prints its first and last entry slot of the day on a gate board generated by Terraform. After the harvest-season schedule was loaded, the plan began failing on the board's last-entry slot line.
objective: >-
  Make terraform apply work so output last_entry is 17:30 for the default timetable, and keep it correct when the entry_times list has a different number of entry slots (the check also plans with 3 and 5 entry slots).
xp: 130
difficulty: beginner
expected_time: 5m
concepts:
  - lists
  - indexing
  - length
module: module-3-variables-outputs
level: level-2-list-index-bounds
